  <style>
    .sticky-col-1 {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: white;

      left: 48px;

      background-color: white;

    .sticky-header-1 {
      position: sticky;
      left: 0;
      z-index: 20;

    }

    .sticky-header-2 {
      position: sticky;
      left: 48px;
      z-index: 20;
      background-color: #f8fafc;
    }
  </style>
</head>

    <div class="flex flex-wrap gap-2">

        class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm">

        + Add Parade Date
      </button>

      <button onclick="exportToCSV()"

        📥 Export CSV
      </button>
    </div>
  </header>
