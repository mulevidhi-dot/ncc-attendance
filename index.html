<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCC Battalion Attendance Register</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .sticky-col-1 {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: white;
      min-width: 48px;
    }

    .sticky-col-2 {
      position: sticky;
      left: 48px;
      z-index: 10;
      background-color: white;
    }

    .sticky-header-1 {
      position: sticky;
      left: 0;
      z-index: 20;
      background-color: #f8fafc;
    }

    .sticky-header-2 {
      position: sticky;
      left: 48px;
      z-index: 20;
      background-color: #f8fafc;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

<div class="max-w-7xl mx-auto space-y-6">

  <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="w-3 h-3 bg-red-600 rounded-full"></span>
        <span class="w-3 h-3 bg-blue-900 rounded-full"></span>
        <span class="w-3 h-3 bg-sky-400 rounded-full"></span>
        <h1 class="text-2xl font-bold text-slate-900 ml-2">
          NCC Candidate Attendance Register
        </h1>
      </div>
      <p id="connection-status" class="text-sm text-slate-500 mt-2">
        Starting register...
      </p>
    </div>

    <div class="flex flex-wrap gap-2">
      <button onclick="addStudent()"
        class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm">
        + Add Cadet Name
      </button>

      <button id="btn-add-date" onclick="addDate()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">
        + Add Parade Date
      </button>

      <button onclick="exportToCSV()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm">
        📥 Export CSV
      </button>
    </div>
  </header>

  <!-- Statistics -->
  <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
    <div class="bg-white p-4 rounded-xl border shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">Total Cadets</p>
      <p id="stat-cadets" class="text-2xl font-bold mt-1">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl border shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">Parade Dates</p>
      <p id="stat-parades" class="text-2xl font-bold text-blue-600 mt-1">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl border shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">Event Dates</p>
      <p id="stat-events" class="text-2xl font-bold text-amber-600 mt-1">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl border shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">Official Dates</p>
      <p id="stat-officials" class="text-2xl font-bold text-purple-600 mt-1">0</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="flex border-b bg-white rounded-t-xl px-4 pt-3 shadow-sm gap-4 overflow-x-auto">
    <button onclick="switchTab('parades')" id="tab-parades"
      class="pb-3 px-4 font-bold text-sm border-b-2 text-blue-600 border-blue-600 whitespace-nowrap">
      🛡️ Parades
    </button>

    <button onclick="switchTab('events')" id="tab-events"
      class="pb-3 px-4 font-bold text-sm border-b-2 text-slate-500 border-transparent whitespace-nowrap">
      🎖️ Events
    </button>

    <button onclick="switchTab('officials')" id="tab-officials"
      class="pb-3 px-4 font-bold text-sm border-b-2 text-slate-500 border-transparent whitespace-nowrap">
      📋 Officials
    </button>
  </div>

  <!-- Month Filter -->
  <div class="bg-white shadow-sm border-x px-6 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <label for="date-filter" class="text-sm font-medium text-slate-600">
        Filter Dates by Month:
      </label>

      <select id="date-filter" onchange="render()"
        class="bg-slate-50 border rounded-lg px-3 py-2 text-sm">
        <option value="all">Show All Dates</option>
      </select>
    </div>

    <p id="filter-status" class="text-sm text-slate-500">Ready</p>
  </div>

  <!-- Attendance Table -->
  <div class="bg-white rounded-b-xl shadow-sm border overflow-hidden">
    <div class="overflow-x-auto max-w-full">
      <table class="w-full text-left border-collapse min-w-max">
        <thead>
          <tr id="table-header-row"
            class="bg-slate-50 border-b text-xs font-semibold text-slate-600">
          </tr>
        </thead>

        <tbody id="student-rows" class="divide-y text-sm">
          <tr>
            <td class="text-center p-6 text-slate-400">
              Loading register...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  // ==========================================
  // SUPABASE CONFIGURATION
  // ==========================================

  const SUPABASE_URL = 'https://pdniwpvobbbepipsxskt.supabase.co';

  const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkbml3cHZvYmJlcGlwcHhza3RsIiwicm9sZSI6IkFub24iLCJpYXQiOjE3OTE2MDM2MjYsImV4cCI6MjEwNzE3OTYyNn0.1DmX3AsoqcSXXFjIeIP06OdK1mx4R6GnX-IwTVRZ_XA';

  let db = null;

  try {
    if (window.supabase) {
      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }
  } catch (error) {
    console.error('Supabase initialization failed:', error);
  }

  // ==========================================
  // LOCAL DATA
  // ==========================================

  let currentTab = 'parades';

  function readLocalJSON(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch (error) {
      console.warn('Unable to read local data:', key, error);
      return fallback;
    }
  }

  let students = readLocalJSON('ncc_students', null);

  if (!Array.isArray(students)) {
    students = [
      { id: '1', name: 'Ansh' },
      { id: '2', name: 'Pawan' },
      { id: '3', name: 'Pranav' }
    ];
  }

  let dates = readLocalJSON('ncc_dates', {
    parades: ['2026-05-19', '2026-05-26'],
    events: ['2026-06-01'],
    officials: ['2026-06-10']
  });

  let attendance = readLocalJSON('ncc_attendance', {
    parades: { '1_2026-05-19': 'P' },
    events: {},
    officials: {}
  });

  ['parades', 'events', 'officials'].forEach(category => {
    if (!Array.isArray(dates[category])) {
      dates[category] = [];
    }

    if (!attendance[category] || typeof attendance[category] !== 'object') {
      attendance[category] = {};
    }
  });

  function saveLocal() {
    try {
      localStorage.setItem('ncc_students', JSON.stringify(students));
      localStorage.setItem('ncc_dates', JSON.stringify(dates));
      localStorage.setItem('ncc_attendance', JSON.stringify(attendance));
    } catch (error) {
      alert('Unable to save local data. Check your browser storage.');
      console.error(error);
    }
  }

  // ==========================================
  // CLOUD LOADING
  // ==========================================

  async function loadDataFromCloud() {
    if (!db) {
      document.getElementById('connection-status').innerText =
        'Local Mode Active';
      render();
      return;
    }

    document.getElementById('connection-status').innerText =
      'Connecting to Supabase...';

    try {
      const { data: cadetData, error: cadetError } =
        await db.from('cadets').select('*');

      if (cadetError) throw cadetError;

      if (cadetData && cadetData.length > 0) {
        students = cadetData;
      }

      const { data: attendanceData, error: attendanceError } =
        await db.from('attendance').select('*');

      if (attendanceError) throw attendanceError;

      if (attendanceData && attendanceData.length > 0) {
        dates = {
          parades: [],
          events: [],
          officials: []
        };

        attendance = {
          parades: {},
          events: {},
          officials: {}
        };

        attendanceData.forEach(row => {
          const category = row.category;

          if (!dates[category] || !attendance[category]) return;

          if (row.type === 'date') {
            if (!dates[category].includes(row.date_str)) {
              dates[category].push(row.date_str);
            }
          }

          if (row.type === 'record') {
            attendance[category][
              `${row.cadet_id}_${row.date_str}`
            ] = row.status;
          }
        });

        Object.keys(dates).forEach(category => {
          dates[category].sort();
        });
      }

      saveLocal();

      document.getElementById('connection-status').innerText =
        'Cloud Sync Active • Connected';

    } catch (error) {
      console.error('Cloud loading failed:', error);

      document.getElementById('connection-status').innerText =
        'Local Mode Active • Cloud sync unavailable';
    }

    render();
  }

  // ==========================================
  // TAB SWITCHING
  // ==========================================

  function switchTab(tab) {
    currentTab = tab;

    ['parades', 'events', 'officials'].forEach(category => {
      const button = document.getElementById(`tab-${category}`);

      if (category === tab) {
        button.className =
          'pb-3 px-4 font-bold text-sm border-b-2 text-blue-600 border-blue-600 whitespace-nowrap';
      } else {
        button.className =
          'pb-3 px-4 font-bold text-sm border-b-2 text-slate-500 border-transparent whitespace-nowrap';
      }
    });

    render();
  }

  // ==========================================
  // ADD STUDENT
  // ==========================================

  async function addStudent() {
    const name = prompt('Enter Cadet Name:');

    if (!name || !name.trim()) return;

    const newCadet = {
      id: Date.now().toString(),
      name: name.trim()
    };

    students.push(newCadet);

    saveLocal();
    render();

    if (db) {
      const { error } = await db.from('cadets').insert([newCadet]);

      if (error) {
        console.error('Student cloud save failed:', error);
        document.getElementById('connection-status').innerText =
          'Saved locally • Cloud save failed';
      }
    }
  }

  // ==========================================
  // DELETE STUDENT
  // ==========================================

  async function deleteStudent(id) {
    if (!confirm('Are you sure you want to delete this cadet?')) {
      return;
    }

    students = students.filter(student => String(student.id) !== String(id));

    Object.keys(attendance).forEach(category => {
      Object.keys(attendance[category]).forEach(key => {
        if (key.startsWith(`${id}_`)) {
          delete attendance[category][key];
        }
      });
    });

    saveLocal();
    render();

    if (db) {
      const { error: cadetError } = await db
        .from('cadets')
        .delete()
        .eq('id', id);

      const { error: attendanceError } = await db
        .from('attendance')
        .delete()
        .eq('cadet_id', id);

      if (cadetError || attendanceError) {
        console.error('Cloud deletion failed:', cadetError || attendanceError);
      }
    }
  }

  // ==========================================
  // ADD DATE
  // ==========================================

  async function addDate() {
    const labels = {
      parades: 'Parade',
      events: 'Event',
      officials: 'Official Duty'
    };

    const today = new Date().toLocaleDateString('en-CA');

    const date = prompt(
      `Enter ${labels[currentTab]} Date (YYYY-MM-DD):`,
      today
    );

    if (!date) return;

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      alert('Please enter the date in YYYY-MM-DD format.');
      return;
    }

    if (dates[currentTab].includes(date)) {
      alert('This date already exists.');
      return;
    }

    dates[currentTab].push(date);
    dates[currentTab].sort();

    saveLocal();
    render();

    if (db) {
      const { error } = await db.from('attendance').insert([{
        name: `${currentTab}_date_${date}`,
        category: currentTab,
        type: 'date',
        date_str: date
      }]);

      if (error) {
        console.error('Cloud date save failed:', error);
      }
    }
  }

  // ==========================================
  // DELETE DATE
  // ==========================================

  async function deleteDate(dateToDelete) {
    if (!confirm(`Delete attendance date ${dateToDelete}?`)) {
      return;
    }

    dates[currentTab] = dates[currentTab].filter(
      date => date !== dateToDelete
    );

    Object.keys(attendance[currentTab]).forEach(key => {
      if (key.endsWith(`_${dateToDelete}`)) {
        delete attendance[currentTab][key];
      }
    });

    saveLocal();
    render();

    if (db) {
      const { error } = await db
        .from('attendance')
        .delete()
        .eq('category', currentTab)
        .eq('date_str', dateToDelete);

      if (error) {
        console.error('Cloud date deletion failed:', error);
      }
    }
  }

  // ==========================================
  // MARK ATTENDANCE
  // Click cycle: Blank -> Present -> Absent -> Blank
  // ==========================================

  async function toggleAttendance(studentId, date) {
    const key = `${studentId}_${date}`;
    const currentStatus = attendance[currentTab][key];

    let nextStatus = '';

    if (!currentStatus) {
      nextStatus = 'P';
    } else if (currentStatus === 'P') {
      nextStatus = 'A';
    } else {
      nextStatus = '';
    }

    if (nextStatus) {
      attendance[currentTab][key] = nextStatus;
    } else {
      delete attendance[currentTab][key];
    }

    saveLocal();
    render();

    if (!db) return;

    const { error: deleteError } = await db
      .from('attendance')
      .delete()
      .eq('category', currentTab)
      .eq('type', 'record')
      .eq('cadet_id', studentId)
      .eq('date_str', date);

    if (deleteError) {
      console.error('Cloud attendance update failed:', deleteError);
      return;
    }

    if (nextStatus) {
      const student = students.find(
        item => String(item.id) === String(studentId)
      );

      const { error: insertError } = await db
        .from('attendance')
        .insert([{
          name: `${student ? student.name : 'Cadet'}_${date}`,
          category: currentTab,
          type: 'record',
          cadet_id: studentId,
          date_str: date,
          status: nextStatus
        }]);

      if (insertError) {
        console.error('Cloud attendance save failed:', insertError);
      }
    }
  }

  // ==========================================
  // CALCULATE ATTENDANCE PERCENTAGE
  // Only marked P/A dates are counted.
  // ==========================================

  function calculatePercentage(category, studentId) {
    const categoryDates = dates[category] || [];

    let presentCount = 0;
    let totalConducted = 0;

    categoryDates.forEach(date => {
      const key = `${studentId}_${date}`;
      const status = attendance[category][key];

      if (status === 'P') {
        presentCount++;
        totalConducted++;
      } else if (status === 'A') {
        totalConducted++;
      }
    });

    if (totalConducted === 0) return 0;

    return Math.round((presentCount / totalConducted) * 100);
  }

  // ==========================================
  // CSV EXPORT
  // ==========================================

  function exportToCSV() {
    const rows = [
      ['CATEGORY', 'SR NO', 'Student Name', 'Date', 'Status', 'Percentage']
    ];

    ['parades', 'events', 'officials'].forEach(category => {
      const categoryDates = dates[category] || [];

      students.forEach((student, index) => {
        const percentage = calculatePercentage(category, student.id);

        categoryDates.forEach(date => {
          const status =
            attendance[category][`${student.id}_${date}`] || '-';

          rows.push([
            category.toUpperCase(),
            index + 1,
            student.name,
            date,
            status,
            `${percentage}%`
          ]);
        });
      });
    });

    function escapeCSV(value) {
      return '"' + String(value).replace(/"/g, '""') + '"';
    }

    const csv = rows.map(row => row.map(escapeCSV).join(',')).join('\r\n');

    const blob = new Blob(['\uFEFF' + csv], {
      type: 'text/csv;charset=utf-8;'
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download =
      `NCC_Register_${new Date().toISOString().slice(0, 10)}.csv`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
  }

  // ==========================================
  // MONTH FILTER
  // ==========================================

  function getAvailableMonths() {
    const months = new Set();

    (dates[currentTab] || []).forEach(date => {
      months.add(date.substring(0, 7));
    });

    return Array.from(months).sort();
  }

  function formatMonthYear(value) {
    const parts = value.split('-');

    const monthNames = [
      'January', 'February', 'March', 'April',
      'May', 'June', 'July', 'August',
      'September', 'October', 'November', 'December'
    ];

    return `${monthNames[Number(parts[1]) - 1]} ${parts[0]}`;
  }

  function updateFilterDropdown() {
    const dropdown = document.getElementById('date-filter');
    const previousValue = dropdown.value;

    dropdown.innerHTML = '<option value="all">Show All Dates</option>';

    getAvailableMonths().forEach(month => {
      const option = document.createElement('option');

      option.value = month;
      option.textContent = formatMonthYear(month);

      dropdown.appendChild(option);
    });

    if ([...dropdown.options].some(option => option.value === previousValue)) {
      dropdown.value = previousValue;
    } else {
      dropdown.value = 'all';
    }
  }

  // ==========================================
  // HTML ESCAPING
  // ==========================================

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[character]);
  }

  // ==========================================
  // DISPLAY TABLE
  // ==========================================

  function render() {
    updateFilterDropdown();

    const selectedFilter = document.getElementById('date-filter').value;
    const categoryDates = dates[currentTab] || [];

    const filteredDates = selectedFilter === 'all'
      ? categoryDates
      : categoryDates.filter(date => date.startsWith(selectedFilter));

    document.getElementById('filter-status').textContent =
      selectedFilter === 'all'
        ? `Showing all ${filteredDates.length} dates.`
        : `Showing ${filteredDates.length} of ${categoryDates.length} dates in ${formatMonthYear(selectedFilter)}.`;

    const dateButtonLabels = {
      parades: '+ Add Parade Date',
      events: '+ Add Event Date',
      officials: '+ Add Official Date'
    };

    const percentageLabels = {
      parades: 'Parade %',
      events: 'Event %',
      officials: 'Official %'
    };

    document.getElementById('btn-add-date').textContent =
      dateButtonLabels[currentTab];

    document.getElementById('header-pct-label')?.remove();

    const headerRow = document.getElementById('table-header-row');

    const dateHeaders = filteredDates.map(date => `
      <th class="p-3 border-r min-w-[130px] text-center">
        <div class="flex items-center justify-between gap-2">
          <span>${escapeHTML(date)}</span>
          <button
            onclick="deleteDate('${date}')"
            class="text-slate-400 hover:text-red-600 font-bold px-1"
            title="Delete Date">×</button>
        </div>
      </th>
    `).join('');

    headerRow.innerHTML = `
      <th class="p-3 border-r w-12 text-center sticky-header-1">#</th>
      <th class="p-3 border-r min-w-[200px] sticky-header-2">Student Name</th>
      ${dateHeaders}
      <th class="p-3 border-l bg-slate-100 text-center w-28">
        ${percentageLabels[currentTab]}
      </th>
      <th class="p-3 text-center w-24">Action</th>
    `;

    const rowsContainer = document.getElementById('student-rows');

    if (students.length === 0) {
      rowsContainer.innerHTML = `
        <tr>
          <td colspan="${filteredDates.length + 4}"
            class="text-center p-6 text-slate-400">
            No cadets found. Click "+ Add Cadet Name" to begin.
          </td>
        </tr>
      `;
    } else {
      rowsContainer.innerHTML = students.map((student, index) => {
        const percentage = calculatePercentage(currentTab, student.id);

        const dateCells = filteredDates.map(date => {
          const status =
            attendance[currentTab][`${student.id}_${date}`] || '';

          let buttonClass =
            'bg-slate-50 text-slate-500 hover:bg-slate-100';

          if (status === 'P') {
            buttonClass =
              'bg-emerald-500 text-white font-bold hover:bg-emerald-600';
          } else if (status === 'A') {
            buttonClass =
              'bg-rose-500 text-white font-bold hover:bg-rose-600';
          }

          return `
            <td class="p-2 border-r text-center">
              <button
                onclick="toggleAttendance('${String(student.id).replace(/'/g, "\\'")}', '${date}')"
                class="w-full h-9 rounded text-xs ${buttonClass}">
                ${status || '-'}
              </button>
            </td>
          `;
        }).join('');

        return `
          <tr class="hover:bg-slate-50">
            <td class="p-3 border-r text-center sticky-col-1">
              ${index + 1}
            </td>

            <td class="p-3 border-r font-medium sticky-col-2">
              ${escapeHTML(student.name)}
            </td>

            ${dateCells}

            <td class="p-3 border-l text-center">
              <span class="bg-slate-100 text-slate-800 font-bold px-2.5 py-1 rounded">
                ${percentage}%
              </span>
            </td>

            <td class="p-3 text-center">
              <button
                onclick="deleteStudent('${String(student.id).replace(/'/g, "\\'")}')"
                class="text-rose-600 hover:text-rose-800 font-semibold text-xs">
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Update dashboard statistics.
    document.getElementById('stat-cadets').textContent = students.length;
    document.getElementById('stat-parades').textContent = dates.parades.length;
    document.getElementById('stat-events').textContent = dates.events.length;
    document.getElementById('stat-officials').textContent = dates.officials.length;
  }

  // ==========================================
  // START APPLICATION
  // ==========================================

  saveLocal();
  render();
  loadDataFromCloud();

</script>

</body>
</html>
