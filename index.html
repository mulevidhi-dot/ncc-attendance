<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCC Battalion Attendance Register</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Freeze # and Student Name columns while scrolling dates horizontally */
    .sticky-col-1 {
      position: sticky;
      left: 0;
      z-index: 10;
      background-color: #ffffff;
    }
    .sticky-col-2 {
      position: sticky;
      left: 48px;
      z-index: 10;
      background-color: #ffffff;
    }
    .sticky-header-1 {
      position: sticky;
      left: 0;
      z-index: 20;
      background-color: #f8fafc;
    }
    .sticky-header-2 {
      position: sticky;
      left: 48px;
      z-index: 20;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-red-600 rounded-full inline-block"></span>
          <span class="w-3 h-3 bg-blue-900 rounded-full inline-block"></span>
          <span class="w-3 h-3 bg-sky-400 rounded-full inline-block"></span>
          <h1 class="text-2xl font-bold text-slate-900 ml-2">NCC Battalion Attendance Register</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">Tabbed Register • Switch between Parades, Events & Officials</p>
      </div>

      <div class="flex flex-wrap gap-2">
        <button onclick="addStudent()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
          + Add Cadet Name
        </button>
        <button onclick="addDate()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition" id="btn-add-date">
          + Add Date
        </button>
        <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
          📥 Export CSV
        </button>
      </div>
    </header>

    <!-- Stats Bar -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Cadets</p>
        <p id="stat-cadets" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Parade Dates</p>
        <p id="stat-parades" class="text-2xl font-bold text-blue-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Event Dates</p>
        <p id="stat-events" class="text-2xl font-bold text-amber-600 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Official Dates</p>
        <p id="stat-officials" class="text-2xl font-bold text-purple-600 mt-1">0</p>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-3 shadow-sm gap-4">
      <button onclick="switchTab('parades')" id="tab-parades" class="pb-3 px-4 font-bold text-sm border-b-2 transition text-blue-600 border-blue-600">
        🛡️ Parades
      </button>
      <button onclick="switchTab('events')" id="tab-events" class="pb-3 px-4 font-bold text-sm border-b-2 transition text-slate-500 border-transparent hover:text-slate-800">
        🎖️ Events
      </button>
      <button onclick="switchTab('officials')" id="tab-officials" class="pb-3 px-4 font-bold text-sm border-b-2 transition text-slate-500 border-transparent hover:text-slate-800">
        📋 Officials
      </button>
    </div>

    <!-- Filter Bar (Month Selector) -->
    <div class="bg-white rounded-none shadow-sm border-x border-slate-200 px-6 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <label for="date-filter" class="text-sm font-medium text-slate-600">Filter Dates by Month:</label>
        <select id="date-filter" onchange="render()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-200">
          <option value="all">Show All Dates</option>
        </select>
      </div>
      <p id="filter-status" class="text-sm text-slate-500 italic">Showing all dates.</p>
    </div>

    <!-- Active Table View Container -->
    <div class="bg-white rounded-b-xl shadow-sm border border-slate-200 p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h2 id="section-title" class="text-lg font-bold text-slate-900">Parade Attendance Register</h2>
        <span id="section-badge" class="bg-blue-50 text-blue-700 text-xs font-semibold px-2.5 py-1 rounded-full">Viewing Parades</span>
      </div>
      
      <div class="overflow-x-auto max-w-full">
        <table class="w-full text-left border-collapse min-w-max">
          <thead>
            <tr id="table-header-row" class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600">
              <th class="p-3 border-r border-slate-200 w-12 text-center sticky-header-1">#</th>
              <th class="p-3 border-r border-slate-200 min-w-[200px] sticky-header-2">Student Name</th>
              <!-- Dynamic dates injected here -->
              <th class="p-3 border-l border-slate-200 bg-slate-100 text-center w-28" id="header-pct-label">Parade %</th>
              <th class="p-3 text-center w-20">Action</th>
            </tr>
          </thead>
          <tbody id="student-rows" class="divide-y divide-slate-200 text-sm">
            <!-- Student rows injected here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    let currentTab = 'parades'; // default active tab

    let students = JSON.parse(localStorage.getItem('ncc_students')) || [
      { id: '1', name: 'Ansh' },
      { id: '2', name: 'Pawan' },
      { id: '3', name: 'Pranav' }
    ];

    let dates = JSON.parse(localStorage.getItem('ncc_dates')) || {
      parades: ['2026-05-19', '2026-05-26'],
      events: ['2026-06-01'],
      officials: ['2026-06-10']
    };

    let attendance = JSON.parse(localStorage.getItem('ncc_attendance')) || {
      parades: { '1_2026-05-19': 'P', '2_2026-05-19': 'P' },
      events: { '1_2026-06-01': 'P' },
      officials: { '1_2026-06-10': 'P' }
    };

    function saveData() {
      localStorage.setItem('ncc_students', JSON.stringify(students));
      localStorage.setItem('ncc_dates', JSON.stringify(dates));
      localStorage.setItem('ncc_attendance', JSON.stringify(attendance));
      render();
    }

    function switchTab(tab) {
      currentTab = tab;
      
      // Update tab styles
      ['parades', 'events', 'officials'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === tab) {
          btn.className = "pb-3 px-4 font-bold text-sm border-b-2 transition text-blue-600 border-blue-600";
        } else {
          btn.className = "pb-3 px-4 font-bold text-sm border-b-2 transition text-slate-500 border-transparent hover:text-slate-800";
        }
      });

      render();
    }

    function addStudent() {
      const name = prompt("Enter Cadet Name:");
      if (name && name.trim()) {
        students.push({ id: Date.now().toString(), name: name.trim() });
        saveData();
      }
    }

    function deleteStudent(id) {
      if (confirm("Are you sure you want to delete this cadet?")) {
        students = students.filter(s => s.id !== id);
        saveData();
      }
    }

    function addDate() {
      const date = prompt(`Enter ${currentTab.slice(0, -1)} Date (YYYY-MM-DD):`, new Date().toISOString().split('T')[0]);
      if (date && !dates[currentTab].includes(date)) {
        dates[currentTab].push(date);
        dates[currentTab].sort();
        saveData();
      }
    }

    function deleteDate(dateToDelete) {
      if (confirm(`Remove column for date ${dateToDelete}?`)) {
        dates[currentTab] = dates[currentTab].filter(d => d !== dateToDelete);
        saveData();
      }
    }

    function toggleAttendance(studentId, date) {
      if (!attendance[currentTab]) attendance[currentTab] = {};
      const key = `${studentId}_${date}`;
      const current = attendance[currentTab][key];

      if (!current) {
        attendance[currentTab][key] = 'P';
      } else if (current === 'P') {
        attendance[currentTab][key] = 'A';
      } else {
        delete attendance[currentTab][key];
      }
      saveData();
    }

    function calculatePercentage(category, studentId) {
      const catDates = dates[category];
      if (!catDates || catDates.length === 0) return 0;
      let presentCount = 0;
      let totalConducted = 0;

      catDates.forEach(d => {
        const val = attendance[category] ? attendance[category][`${studentId}_${d}`] : '';
        if (val === 'P') presentCount++;
        if (val === 'P' || val === 'A') totalConducted++;
      });

      if (totalConducted === 0) return 0;
      return Math.round((presentCount / totalConducted) * 100);
    }

    function exportToCSV() {
      let csv = ["CATEGORY,SR NO,Student Name,Date,Status,Percentage"];
      
      ['parades', 'events', 'officials'].forEach(cat => {
        const catDates = dates[cat];
        students.forEach((student, index) => {
          const pct = calculatePercentage(cat, student.id);
          catDates.forEach(d => {
            const status = (attendance[cat] && attendance[cat][`${student.id}_${d}`]) || '-';
            csv.push(`${cat.toUpperCase()},${index + 1},"${student.name}",${d},${status},${pct}%`);
          });
        });
      });

      let blob = new Blob([csv.join("\n")], { type: "text/csv" });
      let link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `NCC_Register_All_Categories_${new Date().toISOString().split('T')[0]}.csv`;
      link.click();
    }

    function getAvailableMonths() {
      const months = new Set();
      dates[currentTab].forEach(d => {
        months.add(d.substring(0, 7)); // YYYY-MM
      });
      return Array.from(months).sort();
    }

    function formatMonthYear(ymString) {
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const parts = ymString.split('-');
      return `${months[parseInt(parts[1]) - 1]} ${parts[0]}`;
    }

    function updateFilterDropdown() {
      const dropdown = document.getElementById('date-filter');
      if (!dropdown) return;

      const currentValue = dropdown.value;
      const availableMonths = getAvailableMonths();

      dropdown.innerHTML = '<option value="all">Show All Dates</option>';

      availableMonths.forEach(ym => {
        const option = document.createElement('option');
        option.value = ym;
        option.innerText = formatMonthYear(ym);
        dropdown.appendChild(option);
      });

      if (currentValue && [...dropdown.options].some(o => o.value === currentValue)) {
        dropdown.value = currentValue;
      } else {
        dropdown.value = 'all';
      }
    }

    function render() {
      updateFilterDropdown();

      const filterElement = document.getElementById('date-filter');
      const selectedFilter = filterElement ? filterElement.value : 'all';
      let catDates = dates[currentTab];
      let filteredDates = [];

      if (selectedFilter === 'all') {
        filteredDates = catDates;
        document.getElementById('filter-status').innerText = `Showing all ${catDates.length} dates.`;
      } else {
        filteredDates = catDates.filter(d => d.startsWith(selectedFilter));
        const monthName = formatMonthYear(selectedFilter);
        document.getElementById('filter-status').innerText = `Showing ${filteredDates.length} of ${catDates.length} total dates in ${monthName}.`;
      }
      
      // Update UI Header Texts
      const titles = { parades: 'Parade Attendance Register', events: 'Event Attendance Register', officials: 'Official Duties Attendance Register' };
      const badges = { parades: 'Viewing Parades', events: 'Viewing Events', officials: 'Viewing Officials' };
      const addBtnLabels = { parades: '+ Add Parade Date', events: '+ Add Event Date', officials: '+ Add Official Date' };
      const pctLabels = { parades: 'Parade %', events: 'Event %', officials: 'Official %' };

      document.getElementById('section-title').innerText = titles[currentTab];
      document.getElementById('section-badge').innerText = badges[currentTab];
      document.getElementById('btn-add-date').innerText = addBtnLabels[currentTab];
      document.getElementById('header-pct-label').innerText = pctLabels[currentTab];

      // Build Table Headers
      const headerRow = document.getElementById('table-header-row');
      let dateHeadersHTML = filteredDates.map(d => `
        <th class="p-3 border-r border-slate-200 min-w-[130px] text-center">
          <div class="flex items-center justify-between gap-2">
            <span>${d}</span>
            <button onclick="deleteDate('${d}')" class="text-slate-400 hover:text-red-600 font-bold px-1 text-sm" title="Delete Date">×</button>
          </div>
        </th>
      `).join('');

      headerRow.innerHTML = `
        <th class="p-3 border-r border-slate-200 w-12 text-center sticky-header-1">#</th>
        <th class="p-3 border-r border-slate-200 min-w-[200px] sticky-header-2">Student Name</th>
        ${dateHeadersHTML}
        <th class="p-3 border-l border-slate-200 bg-slate-100 text-center w-28">${pctLabels[currentTab]}</th>
        <th class="p-3 text-center w-20">Action</th>
      `;

      // Build Student Rows
      const rowsContainer = document.getElementById('student-rows');
      rowsContainer.innerHTML = students.map((student, index) => {
        const pct = calculatePercentage(currentTab, student.id);

        const dateCells = filteredDates.map(d => {
          const status = (attendance[currentTab] && attendance[currentTab][`${student.id}_${d}`]) || '';
          let bgClass = 'bg-slate-50 text-slate-400 hover:bg-slate-100';
          if (status === 'P') bgClass = 'bg-emerald-500 text-white font-bold hover:bg-emerald-600';
          if (status === 'A') bgClass = 'bg-rose-500 text-white font-bold hover:bg-rose-600';

          return `
            <td class="p-2 border-r border-slate-200 text-center">
              <button onclick="toggleAttendance('${student.id}', '${d}')" class="w-full h-9 rounded transition text-xs flex items-center justify-center ${bgClass}">
                ${status || '-'}
              </button>
            </td>
          `;
        }).join('');

        const pctBadge = `<span class="bg-slate-100 text-slate-800 font-bold px-2.5 py-1 rounded-full text-xs">${pct}%</span>`;

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 border-r border-slate-200 text-center font-medium text-slate-400 sticky-col-1">${index + 1}</td>
            <td class="p-3 border-r border-slate-200 font-semibold text-slate-800 sticky-col-2">${student.name}</td>
            ${dateCells}
            <td class="p-3 border-l border-slate-200 bg-slate-50/50 text-center font-bold">${pctBadge}</td>
            <td class="p-3 text-center">
              <button onclick="deleteStudent('${student.id}')" class="text-slate-400 hover:text-red-600 text-xs">Delete</button>
            </td>
          </tr>
        `;
      }).join('');

      // Update Stats Bar
      document.getElementById('stat-cadets').innerText = students.length;
      document.getElementById('stat-parades').innerText = dates.parades.length;
      document.getElementById('stat-events').innerText = dates.events.length;
      document.getElementById('stat-officials').innerText = dates.officials.length;
    }

    render();
  </script>
</body>
</html>
