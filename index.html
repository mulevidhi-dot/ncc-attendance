<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCC Battalion Attendance Register</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Header -->
    <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 bg-red-600 rounded-full inline-block"></span>
          <span class="w-3 h-3 bg-blue-900 rounded-full inline-block"></span>
          <span class="w-3 h-3 bg-sky-400 rounded-full inline-block"></span>
          <h1 class="text-2xl font-bold text-slate-900 ml-2">NCC Candidate Attendance Register</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">Spreadsheet Register • Click any cell to toggle Present (P) / Absent (A)</p>
      </div>

      <div class="flex flex-wrap gap-2">
        <button onclick="addStudent()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
          + Add Cadet Name
        </button>
        <button onclick="addParadeDate()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
          + Add Date
        </button>
      </div>
    </header>

    <!-- Stats Bar (Filter Status added) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Cadets</p>
        <p id="stat-cadets" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Parades Conducted</p>
        <p id="stat-parades" class="text-2xl font-bold text-slate-800 mt-1">0</p>
      </div>
    </div>

    <!-- Filter Bar (Option 3 Implementation) -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col md:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <label for="date-filter" class="text-sm font-medium text-slate-600">Filter Parade Dates:</label>
        <select id="date-filter" onchange="render()" class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-sm font-semibold text-slate-800 focus:ring-2 focus:ring-blue-200">
          <option value="all">Show All Parades</option>
          <!-- Dynamic Month Options inserted here -->
        </select>
      </div>
      <p id="filter-status" class="text-sm text-slate-500 italic">Showing all parades.</p>
    </div>

    <!-- Main Spreadsheet Table -->
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr id="table-header-row" class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600">
              <th class="p-3 border-r border-slate-200 w-12 text-center">#</th>
              <th class="p-3 border-r border-slate-200 min-w-[200px]">Student Name</th>
              <!-- Dynamic Date Columns will be inserted here -->
              <th class="p-3 border-l border-slate-200 bg-slate-100 text-center w-28">Total %</th>
              <th class="p-3 text-center w-20">Action</th>
            </tr>
          </thead>
          <tbody id="student-rows" class="divide-y divide-slate-200 text-sm">
            <!-- Student rows injected here -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Initial Data with simulated historical dates for demonstration
    let students = JSON.parse(localStorage.getItem('ncc_students')) || [
      { id: '1', name: 'Ansh' },
      { id: '2', name: 'Rahul Sharma' }
    ];

    let dates = JSON.parse(localStorage.getItem('ncc_dates')) || [
      '2026-05-19', '2026-05-26', // May
      '2026-08-04', '2026-08-11', // August
      '2026-10-01', '2026-10-05', '2026-10-10' // October
    ];
    dates.sort();
    
    let attendance = JSON.parse(localStorage.getItem('ncc_attendance')) || {};

    function saveData() {
      localStorage.setItem('ncc_students', JSON.stringify(students));
      localStorage.setItem('ncc_dates', JSON.stringify(dates));
      localStorage.setItem('ncc_attendance', JSON.stringify(attendance));
      render();
    }

    function addStudent() {
      const name = prompt("Enter Student Name:");
      if (name && name.trim()) {
        students.push({ id: Date.now().toString(), name: name.trim() });
        saveData();
      }
    }

    function deleteStudent(id) {
      if (confirm("Are you sure you want to delete this student?")) {
        students = students.filter(s => s.id !== id);
        saveData();
      }
    }

    function addParadeDate() {
      const date = prompt("Enter Parade Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
      if (date && !dates.includes(date)) {
        dates.push(date);
        dates.sort();
        saveData();
      }
    }

    function deleteDate(dateToDelete) {
      if (confirm(`Remove column for date ${dateToDelete}?`)) {
        dates = dates.filter(d => d !== dateToDelete);
        saveData();
      }
    }

    function toggleAttendance(studentId, date) {
      const key = `${studentId}_${date}`;
      const current = attendance[key];

      if (!current) {
        attendance[key] = 'P';
      } else if (current === 'P') {
        attendance[key] = 'A';
      } else {
        delete attendance[key]; // reset to blank
      }
      saveData();
    }

    function calculatePercentage(studentId) {
      if (dates.length === 0) return 0;
      let presentCount = 0;
      let totalConducted = 0;

      dates.forEach(d => {
        const val = attendance[`${studentId}_${d}`];
        if (val === 'P') presentCount++;
        if (val === 'P' || val === 'A') totalConducted++;
      });

      if (totalConducted === 0) return 0;
      return Math.round((presentCount / totalConducted) * 100);
    }

    // --- Filter logic for Option 3 ---

    // 1. Get unique Year-Month combinations from existing dates
    function getAvailableMonths() {
      const months = new Set();
      dates.forEach(d => {
        const monthYear = d.substring(0, 7); // YYYY-MM
        months.add(monthYear);
      });
      return Array.from(months).sort();
    }

    // 2. Format a YYYY-MM string to "Month Name YYYY" (e.g., October 2026)
    function formatMonthYear(ymString) {
      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const parts = ymString.split('-');
      return `${months[parseInt(parts[1]) - 1]} ${parts[0]}`;
    }

    function updateFilterDropdown() {
      const dropdown = document.getElementById('date-filter');
      const currentValue = dropdown.value;
      const availableMonths = getAvailableMonths();

      // Clear existing month options, keeping only "Show All"
      dropdown.innerHTML = '<option value="all">Show All Parades</option>';

      // Add new month options dynamically
      availableMonths.forEach(ym => {
        const option = document.createElement('option');
        option.value = ym;
        option.innerText = formatMonthYear(ym);
        dropdown.appendChild(option);
      });

      // Restore previously selected filter if it still exists
      if (currentValue && [...dropdown.options].some(o => o.value === currentValue)) {
        dropdown.value = currentValue;
      }
    }

    // --- Main render function (updated for filtering) ---
    function render() {
      // Refresh the filter dropdown options
      updateFilterDropdown();

      // Get the current filter value
      const selectedFilter = document.getElementById('date-filter').value;
      let filteredDates = [];

      // Determine which dates to show
      if (selectedFilter === 'all') {
        filteredDates = dates;
        document.getElementById('filter-status').innerText = `Showing all ${dates.length} parades.`;
      } else {
        filteredDates = dates.filter(d => d.startsWith(selectedFilter));
        const monthName = formatMonthYear(selectedFilter);
        document.getElementById('filter-status').innerText = `Showing ${filteredDates.length} of ${dates.length} total parades in ${monthName}.`;
      }

      // Rebuild Header Row dynamically based on FILTERED dates
      const headerRow = document.getElementById('table-header-row');
      
      let dateHeadersHTML = filteredDates.map(d => `
        <th class="p-3 border-r border-slate-200 min-w-[120px] text-center">
          <div class="flex items-center justify-between gap-2">
            <span>${d}</span>
            <button onclick="deleteDate('${d}')" class="text-slate-400 hover:text-red-600 font-bold px-1 text-sm" title="Delete Date">×</button>
          </div>
        </th>
      `).join('');

      headerRow.innerHTML = `
        <th class="p-3 border-r border-slate-200 w-12 text-center">#</th>
        <th class="p-3 border-r border-slate-200 min-w-[200px]">Student Name</th>
        ${dateHeadersHTML}
        <th class="p-3 border-l border-slate-200 bg-slate-100 text-center w-28">Total %</th>
        <th class="p-3 text-center w-20">Action</th>
      `;

      // Render Student Rows & Matrix Cells based on FILTERED dates
      const rowsContainer = document.getElementById('student-rows');

      rowsContainer.innerHTML = students.map((student, index) => {
        // Percentage always calculates against ALL dates (dates array, not filteredDates)
        const pct = calculatePercentage(student.id);

        // Cells generated only for FILTERED dates
        const dateCells = filteredDates.map(d => {
          const status = attendance[`${student.id}_${d}`] || '';
          let bgClass = 'bg-slate-50 text-slate-400 hover:bg-slate-100';
          if (status === 'P') bgClass = 'bg-emerald-500 text-white font-bold hover:bg-emerald-600';
          if (status === 'A') bgClass = 'bg-rose-500 text-white font-bold hover:bg-rose-600';

          return `
            <td class="p-2 border-r border-slate-200 text-center">
              <button onclick="toggleAttendance('${student.id}', '${d}')" class="w-full h-9 rounded transition text-xs flex items-center justify-center ${bgClass}">
                ${status || '-'}
              </button>
            </td>
          `;
        }).join('');

        const pctBadge = `<span class="bg-slate-100 text-slate-800 font-bold px-2.5 py-1 rounded-full text-xs">${pct}%</span>`;

        return `
          <tr class="hover:bg-slate-50 transition">
            <td class="p-3 border-r border-slate-200 text-center font-medium text-slate-400">${index + 1}</td>
            <td class="p-3 border-r border-slate-200 font-semibold text-slate-800">${student.name}</td>
            ${dateCells}
            <td class="p-3 border-l border-slate-200 bg-slate-50/50 text-center font-bold">${pctBadge}</td>
            <td class="p-3 text-center">
              <button onclick="deleteStudent('${student.id}')" class="text-slate-400 hover:text-red-600 text-xs">Delete</button>
            </td>
          </tr>
        `;
      }).join('');

      // Render overall Stats
      document.getElementById('stat-cadets').innerText = students.length;
      document.getElementById('stat-parades').innerText = dates.length;
    }

    // Initial load
    render();
  </script>
</body>
</html>
