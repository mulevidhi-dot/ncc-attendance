<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCC Attendance Register</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    .sticky-col-1,
    .sticky-header-1 {
      position: sticky;
      left: 0;
      z-index: 10;
      background: #fff;
      min-width: 48px;
    }

    .sticky-col-2,
    .sticky-header-2 {
      position: sticky;
      left: 48px;
      z-index: 10;
      background: #fff;
    }

    .sticky-header-1,
    .sticky-header-2 {
      z-index: 20;
      background: #f8fafc;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen text-slate-800 p-4 md:p-8">

<div class="max-w-7xl mx-auto space-y-6">

  <header class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div>
      <div class="flex items-center gap-2 flex-wrap">
        <span class="w-3 h-3 bg-red-600 rounded-full"></span>
        <span class="w-3 h-3 bg-blue-900 rounded-full"></span>
        <span class="w-3 h-3 bg-sky-400 rounded-full"></span>

        <h1 class="text-2xl font-bold text-slate-900 ml-2">
          NCC Candidate Attendance Register
        </h1>
      </div>

      <p id="connection-status" class="text-sm text-slate-500 mt-2">
        Starting register...
      </p>
    </div>

    <div class="flex flex-wrap gap-2">
      <button onclick="addStudent()"
        class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-lg text-sm">
        + Add  Name
      </button>

      <button id="btn-add-date" onclick="addDate()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm">
        + Add Parade Date
      </button>

      <button onclick="exportToCSV()"
        class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm">
        Export CSV
      </button>
    </div>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">

    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">
        Total Cadets (this tab)
      </p>
      <p id="stat-cadets" class="text-2xl font-bold mt-1">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">
        Parade Dates
      </p>
      <p id="stat-parades" class="text-2xl font-bold text-blue-600 mt-1">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">
        Event Dates
      </p>
      <p id="stat-events" class="text-2xl font-bold text-amber-600 mt-1">0</p>
    </div>

    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
      <p class="text-xs font-semibold text-slate-400 uppercase">
        Official Dates
      </p>
      <p id="stat-officials" class="text-2xl font-bold text-purple-600 mt-1">0</p>
    </div>

  </div>

  <div class="flex border-b border-slate-200 bg-white rounded-t-xl px-4 pt-3 shadow-sm gap-4 overflow-x-auto">

    <button onclick="switchTab('parades')" id="tab-parades"
      class="pb-3 px-4 font-bold text-sm border-b-2 text-blue-600 border-blue-600 whitespace-nowrap">
      Parades
    </button>

    <button onclick="switchTab('events')" id="tab-events"
      class="pb-3 px-4 font-bold text-sm border-b-2 text-slate-500 border-transparent whitespace-nowrap">
      Events
    </button>

    <button onclick="switchTab('officials')" id="tab-officials"
      class="pb-3 px-4 font-bold text-sm border-b-2 text-slate-500 border-transparent whitespace-nowrap">
      Officials
    </button>

  </div>

  <div class="bg-white shadow-sm border-x border-slate-200 px-6 py-3 flex flex-col md:flex-row justify-between items-center gap-4">

    <div class="flex items-center gap-3">
      <label for="date-filter" class="text-sm font-medium text-slate-600">
        Filter Dates by Month:
      </label>

      <select id="date-filter" onchange="render()"
        class="bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm">
        <option value="all">Show All Dates</option>
      </select>
    </div>

    <p id="filter-status" class="text-sm text-slate-500">Ready</p>

  </div>

  <div class="bg-white rounded-b-xl shadow-sm border border-slate-200 overflow-hidden">
    <div class="overflow-x-auto max-w-full">

      <table class="w-full text-left border-collapse min-w-max">
        <thead>
          <tr id="table-header-row"
            class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600">
          </tr>
        </thead>

        <tbody id="student-rows" class="divide-y divide-slate-200 text-sm">
        </tbody>
      </table>

    </div>
  </div>

</div>

<script>
  // Supabase settings.
 
const SUPABASE_URL =
  'https://pdniwpvobbbepipsxskt.supabase.co';

const SUPABASE_ANON_KEY =
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkbml3cHZvYmJlcGlwc3hza3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDM2MjYsImV4cCI6MjEwNzE3OTYyNn0.1DmX3AsoqcSXXFjIeIP06OdK1mx4R6GnX-IwTVRZ_XA';

let db = null;

try {
  if (!window.supabase) {
    throw new Error('Supabase library did not load.');
  }

  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  console.log('Supabase client initialized.');
} catch (error) {
  console.error('Supabase initialization failed:', error);
}


  const CATEGORIES = ['parades', 'events', 'officials'];

  let currentTab = 'parades';

  function readLocalJSON(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (error) {
      console.warn('Could not read saved data:', key, error);
      return fallback;
    }
  }

  // Each tab has its own separate cadet list.
  const defaultStudents = {
    parades: [
      { id: '1', name: 'Ansh' },
      { id: '2', name: 'Pawan' },
      { id: '3', name: 'Pranav' }
    ],

    events: [],

    officials: []
  };

  let studentsByCategory = readLocalJSON(
    'ncc_students_by_category',
    null
  );

  // Migrate an older shared list into the Parades tab.
  if (!studentsByCategory || typeof studentsByCategory !== 'object') {
    const oldStudents = readLocalJSON('ncc_students', null);

    studentsByCategory = {
      parades:
        Array.isArray(oldStudents) && oldStudents.length
          ? oldStudents
          : defaultStudents.parades,

      events: [],

      officials: []
    };
  }

  CATEGORIES.forEach(category => {
    if (!Array.isArray(studentsByCategory[category])) {
      studentsByCategory[category] = [];
    }
  });

  let dates = readLocalJSON('ncc_dates', {
    parades: ['2026-05-19', '2026-05-26'],
    events: ['2026-06-01'],
    officials: ['2026-06-10']
  });

  let attendance = readLocalJSON('ncc_attendance', {
    parades: {
      '1_2026-05-19': 'P'
    },

    events: {},

    officials: {}
  });

  CATEGORIES.forEach(category => {
    if (!Array.isArray(dates[category])) {
      dates[category] = [];
    }

    if (
      !attendance[category] ||
      typeof attendance[category] !== 'object'
    ) {
      attendance[category] = {};
    }
  });

  function getCurrentStudents() {
    return studentsByCategory[currentTab];
  }

  function saveLocal() {
    try {
      localStorage.setItem(
        'ncc_students_by_category',
        JSON.stringify(studentsByCategory)
      );

      localStorage.setItem(
        'ncc_dates',
        JSON.stringify(dates)
      );

      localStorage.setItem(
        'ncc_attendance',
        JSON.stringify(attendance)
      );
    } catch (error) {
      console.error('Local save failed:', error);
      alert('Unable to save data in this browser.');
    }
  }

  async function loadDataFromCloud() {
    if (!db) {
      document.getElementById('connection-status').textContent =
        'Local Mode Active (saved in this browser)';

      render();
      return;
    }

    document.getElementById('connection-status').textContent =
      'Syncing with Supabase...';

    try {
      const {
        data: cadetData,
        error: cadetError
      } = await db.from('cadets').select('*');

      if (cadetError) throw cadetError;

      if (Array.isArray(cadetData)) {
        CATEGORIES.forEach(category => {
          const categoryRows = cadetData.filter(
            row => row.category === category
          );

          if (categoryRows.length) {
            studentsByCategory[category] = categoryRows.map(row => ({
              id: String(row.id),
              name: row.name,
              category
            }));
          }
        });
      }

      const {
        data: attData,
        error: attError
      } = await db.from('attendance').select('*');

      if (attError) throw attError;

      if (Array.isArray(attData) && attData.length) {
        dates = {
          parades: [],
          events: [],
          officials: []
        };

        attendance = {
          parades: {},
          events: {},
          officials: {}
        };

        attData.forEach(row => {
          const category = row.category;

          if (!CATEGORIES.includes(category)) return;

          if (
            row.type === 'date' &&
            row.date_str &&
            !dates[category].includes(row.date_str)
          ) {
            dates[category].push(row.date_str);
          } else if (
            row.type === 'record' &&
            row.date_str &&
            row.cadet_id != null
          ) {
            attendance[category][
              `${row.cadet_id}_${row.date_str}`
            ] = row.status;
          }
        });

        CATEGORIES.forEach(category => dates[category].sort());
      }

      saveLocal();

      document.getElementById('connection-status').textContent =
        'Cloud Sync Active';

    } catch (error) {
      console.error('Cloud sync failed:', error);

      document.getElementById('connection-status').textContent =
        'Local Mode Active • Cloud sync unavailable';
    }

    render();
  }

  function switchTab(tab) {
    if (!CATEGORIES.includes(tab)) return;

    currentTab = tab;

    CATEGORIES.forEach(category => {
      const button = document.getElementById(`tab-${category}`);

      button.className = category === tab
        ? 'pb-3 px-4 font-bold text-sm border-b-2 text-blue-600 border-blue-600 whitespace-nowrap'
        : 'pb-3 px-4 font-bold text-sm border-b-2 text-slate-500 border-transparent whitespace-nowrap';
    });

    render();
  }

  async function addStudent() {
    const label = {
      parades: 'Parade',
      events: 'Event',
      officials: 'Official Duty'
    };

    const name = prompt(
      `Enter ${label[currentTab]} Cadet Name:`
    );

    if (!name || !name.trim()) return;

    const cleanName = name.trim();

    const duplicate = getCurrentStudents().some(
      student =>
        student.name.toLowerCase() === cleanName.toLowerCase()
    );

    if (duplicate) {
      alert('This name is already in this tab.');
      return;
    }

    const newCadet = {
      id: `local-${Date.now()}`,
      name: cleanName,
      category: currentTab
    };

    studentsByCategory[currentTab].push(newCadet);

    saveLocal();
    render();

    if (db) {
      const { error } = await db.from('cadets').insert([
        {
          name: cleanName,
          category: currentTab
        }
      ]);

      if (error) {
        console.error('Cloud student save failed:', error);

        document.getElementById('connection-status').textContent =
          'Saved locally • Cloud save failed';
      } else {
        await loadDataFromCloud();
      }
    }
  }

  async function deleteStudent(id) {
    if (!confirm('Delete this cadet from this tab?')) return;

    studentsByCategory[currentTab] =
      getCurrentStudents().filter(
        student => String(student.id) !== String(id)
      );

    // Remove only this cadet's attendance from the current tab.
    Object.keys(attendance[currentTab]).forEach(key => {
      if (key.startsWith(`${id}_`)) {
        delete attendance[currentTab][key];
      }
    });

    saveLocal();
    render();

    if (db && !String(id).startsWith('local-')) {
      const { error } = await db
        .from('cadets')
        .delete()
        .eq('id', id)
        .eq('category', currentTab);

      if (error) console.error('Cloud delete failed:', error);

      const { error: attendanceError } = await db
        .from('attendance')
        .delete()
        .eq('cadet_id', id)
        .eq('category', currentTab);

      if (attendanceError) {
        console.error('Cloud attendance delete failed:', attendanceError);
      }
    }
  }

  async function addDate() {
    const date = prompt(
      'Enter date (YYYY-MM-DD):',
      new Date().toISOString().slice(0, 10)
    );

    if (!date) return;

    if (
      !/^\d{4}-\d{2}-\d{2}$/.test(date) ||
      Number.isNaN(Date.parse(date))
    ) {
      alert('Please enter a valid date in YYYY-MM-DD format.');
      return;
    }

    if (dates[currentTab].includes(date)) {
      alert('This date already exists in this tab.');
      return;
    }

    dates[currentTab].push(date);
    dates[currentTab].sort();

    saveLocal();
    render();

    if (db) {
      const { error } = await db.from('attendance').insert([
        {
          name: `${currentTab}_date_${date}`,
          category: currentTab,
          type: 'date',
          date_str: date
        }
      ]);

      if (error) {
        console.error('Cloud date save failed:', error);
      }
    }
  }

  async function deleteDate(date) {
    if (!confirm(`Delete date ${date} from ${currentTab}?`)) return;

    dates[currentTab] = dates[currentTab].filter(
      item => item !== date
    );

    Object.keys(attendance[currentTab]).forEach(key => {
      if (key.endsWith(`_${date}`)) {
        delete attendance[currentTab][key];
      }
    });

    saveLocal();
    render();

    if (db) {
      const { error } = await db
        .from('attendance')
        .delete()
        .eq('category', currentTab)
        .eq('date_str', date);

      if (error) console.error('Cloud date delete failed:', error);
    }
  }

  async function toggleAttendance(studentId, date) {
    const key = `${studentId}_${date}`;

    const current = attendance[currentTab][key];

    // Click once for Present, again for Absent, and again to clear.
    const next =
      !current ? 'P' : current === 'P' ? 'A' : '';

    if (next) {
      attendance[currentTab][key] = next;
    } else {
      delete attendance[currentTab][key];
    }

    saveLocal();
    render();

    if (!db || String(studentId).startsWith('local-')) return;

    const { error: deleteError } = await db
      .from('attendance')
      .delete()
      .eq('category', currentTab)
      .eq('type', 'record')
      .eq('cadet_id', studentId)
      .eq('date_str', date);

    if (deleteError) {
      console.error('Cloud attendance update failed:', deleteError);
      return;
    }

    if (next) {
      const student = getCurrentStudents().find(
        item => String(item.id) === String(studentId)
      );

      const { error } = await db.from('attendance').insert([
        {
          name: `${student ? student.name : 'Cadet'}_${date}`,
          category: currentTab,
          type: 'record',
          cadet_id: studentId,
          date_str: date,
          status: next
        }
      ]);

      if (error) {
        console.error('Cloud attendance save failed:', error);
      }
    }
  }

  function calculatePercentage(category, studentId) {
    const categoryDates = dates[category] || [];

    let present = 0;
    let marked = 0;

    categoryDates.forEach(date => {
      const status =
        attendance[category][`${studentId}_${date}`];

      if (status === 'P') {
        present++;
        marked++;
      } else if (status === 'A') {
        marked++;
      }
    });

    return marked
      ? Math.round((present / marked) * 100)
      : 0;
  }

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[character]);
  }

  function exportToCSV() {
    const rows = [
      [
        'CATEGORY',
        'SR NO',
        'Student Name',
        'Date',
        'Status',
        'Percentage'
      ]
    ];

    CATEGORIES.forEach(category => {
      studentsByCategory[category].forEach((student, index) => {
        const percentage = calculatePercentage(
          category,
          student.id
        );

        dates[category].forEach(date => {
          const status =
            attendance[category][`${student.id}_${date}`] || '-';

          rows.push([
            category.toUpperCase(),
            index + 1,
            student.name,
            date,
            status,
            `${percentage}%`
          ]);
        });
      });
    });

    const csv = rows.map(row =>
      row.map(value =>
        `"${String(value).replace(/"/g, '""')}"`
      ).join(',')
    ).join('\r\n');

    const blob = new Blob(
      ['\uFEFF' + csv],
      { type: 'text/csv;charset=utf-8;' }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download =
      `NCC_Register_${new Date().toISOString().slice(0, 10)}.csv`;

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
  }

  function getAvailableMonths() {
    return [
      ...new Set(
        (dates[currentTab] || []).map(date => date.slice(0, 7))
      )
    ].sort();
  }

  function formatMonthYear(value) {
    const parts = value.split('-');

    const names = [
      'January', 'February', 'March', 'April',
      'May', 'June', 'July', 'August',
      'September', 'October', 'November', 'December'
    ];

    return `${names[Number(parts[1]) - 1]} ${parts[0]}`;
  }

  function updateFilterDropdown() {
    const dropdown = document.getElementById('date-filter');
    const previous = dropdown.value;

    dropdown.innerHTML =
      '<option value="all">Show All Dates</option>';

    getAvailableMonths().forEach(month => {
      const option = document.createElement('option');

      option.value = month;
      option.textContent = formatMonthYear(month);

      dropdown.appendChild(option);
    });

    dropdown.value = [...dropdown.options].some(
      option => option.value === previous
    ) ? previous : 'all';
  }

  function render() {
    const students = getCurrentStudents();

    updateFilterDropdown();

    const selected =
      document.getElementById('date-filter').value;

    const allDates = dates[currentTab] || [];

    const visibleDates = selected === 'all'
      ? allDates
      : allDates.filter(date => date.startsWith(selected));

    document.getElementById('filter-status').textContent =
      selected === 'all'
        ? `Showing all ${visibleDates.length} dates.`
        : `Showing ${visibleDates.length} of ${allDates.length} dates in ${formatMonthYear(selected)}.`;

    const labels = {
      parades: 'Parade',
      events: 'Event',
      officials: 'Official Duty'
    };

    document.getElementById('btn-add-date').textContent =
      `+ Add ${labels[currentTab]} Date`;

    document.getElementById('table-header-row').innerHTML = `
      <th class="p-3 border-r w-12 text-center sticky-header-1">
        #
      </th>

      <th class="p-3 border-r min-w-[200px] sticky-header-2">
        Cadet Name
      </th>

      ${visibleDates.map(date => `
        <th class="p-3 border-r min-w-[130px] text-center">
          <div class="flex items-center justify-between gap-2">
            <span>${escapeHTML(date)}</span>

            <button
              onclick="deleteDate('${date}')"
              class="text-slate-400 hover:text-red-600 font-bold px-1"
              title="Delete date">
              ×
            </button>
          </div>
        </th>
      `).join('')}

      <th class="p-3 border-l bg-slate-100 text-center w-28">
        ${labels[currentTab]} %
      </th>

      <th class="p-3 text-center w-24">
        Action
      </th>
    `;

    const body = document.getElementById('student-rows');

    if (!students.length) {
      body.innerHTML = `
        <tr>
          <td colspan="${visibleDates.length + 4}"
            class="text-center p-6 text-slate-400">
            No cadets in ${labels[currentTab]}.
            Click "+ Add Cadet Name" to add one.
          </td>
        </tr>
      `;
    } else {
      body.innerHTML = students.map((student, index) => {
        const cells = visibleDates.map(date => {
          const status =
            attendance[currentTab][`${student.id}_${date}`] || '';

          const style = status === 'P'
            ? 'bg-emerald-500 text-white font-bold hover:bg-emerald-600'
            : status === 'A'
              ? 'bg-rose-500 text-white font-bold hover:bg-rose-600'
              : 'bg-slate-50 text-slate-500 hover:bg-slate-100';

          const safeId = String(student.id).replace(/'/g, "\\'");

          return `
            <td class="p-2 border-r text-center">
              <button
                onclick="toggleAttendance('${safeId}','${date}')"
                class="w-full h-9 rounded text-xs ${style}">
                ${status || '-'}
              </button>
            </td>
          `;
        }).join('');

        const percentage = calculatePercentage(
          currentTab,
          student.id
        );

        const safeId = String(student.id).replace(/'/g, "\\'");

        return `
          <tr class="hover:bg-slate-50">

            <td class="p-3 border-r text-center sticky-col-1">
              ${index + 1}
            </td>

            <td class="p-3 border-r font-medium sticky-col-2">
              ${escapeHTML(student.name)}
            </td>

            ${cells}

            <td class="p-3 border-l text-center">
              <span class="bg-slate-100 font-bold px-2.5 py-1 rounded">
                ${percentage}%
              </span>
            </td>

            <td class="p-3 text-center">
              <button
                onclick="deleteStudent('${safeId}')"
                class="text-rose-600 hover:text-rose-800 font-semibold text-xs">
                Delete
              </button>
            </td>

          </tr>
        `;
      }).join('');
    }

    document.getElementById('stat-cadets').textContent =
      students.length;

    document.getElementById('stat-parades').textContent =
      dates.parades.length;

    document.getElementById('stat-events').textContent =
      dates.events.length;

    document.getElementById('stat-officials').textContent =
      dates.officials.length;
  }

  // Start the register.
  saveLocal();
  render();
  loadDataFromCloud();

</script>

</body>
</html>
