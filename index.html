
<script>
  // ==========================================
  // 1. SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL =
    'sb_publishable_qBMH8I5mPVE4UypLEV6F9w_AVz0ozFK';

  // Keep the public key you already added.
  const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBkbml3cHZvYmJlcGlwc3hza3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2MDM2MjYsImV4cCI6MjEwNzE3OTYyNn0.1DmX3AsoqcSXXFjIeIP06OdK1mx4R6GnX-IwTVRZ_XA';

  let db = null;

  try {
    if (window.supabase) {
      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    }
  } catch (error) {
    console.error('Supabase initialization error:', error);
  }

  const CATEGORIES = ['parades', 'events', 'officials'];

  const TABLES = {
    parades: 'ncc_parades_register',
    events: 'ncc_events_register',
    officials: 'ncc_officials_register'
  };

  const REPORT_VIEWS = {
    parades: 'ncc_parades_report',
    events: 'ncc_events_report',
    officials: 'ncc_officials_report'
  };

  const LABELS = {
    parades: 'Parade',
    events: 'Event',
    officials: 'Official Duty'
  };

  let currentTab = 'parades';

  // ==========================================
  // 2. LOCAL STORAGE BACKUP
  // ==========================================

  function readLocalJSON(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value ? JSON.parse(value) : fallback;
    } catch (error) {
      console.error('Local storage read error:', error);
      return fallback;
    }
  }

  const defaultStudents = {
    parades: [
      { id: 'demo-p1', name: 'Ansh' },
      { id: 'demo-p2', name: 'Pawan' },
      { id: 'demo-p3', name: 'Pranav' }
    ],
    events: [],
    officials: []
  };

  let studentsByCategory = readLocalJSON(
    'ncc_students_by_category',
    defaultStudents
  );

  let dates = readLocalJSON('ncc_dates', {
    parades: [],
    events: [],
    officials: []
  });

  let attendance = readLocalJSON('ncc_attendance', {
    parades: {},
    events: {},
    officials: {}
  });

  CATEGORIES.forEach(category => {
    if (!Array.isArray(studentsByCategory[category])) {
      studentsByCategory[category] = [];
    }

    if (!Array.isArray(dates[category])) {
      dates[category] = [];
    }

    if (
      !attendance[category] ||
      typeof attendance[category] !== 'object'
    ) {
      attendance[category] = {};
    }
  });

  // IDs of cadets that exist in Supabase.
  // Local-only cadets are not sent to Supabase until created there.
  let cloudCadetIds = {
    parades: new Set(),
    events: new Set(),
    officials: new Set()
  };

  function getCurrentStudents() {
    return studentsByCategory[currentTab];
  }

  function saveLocal() {
    try {
      localStorage.setItem(
        'ncc_students_by_category',
        JSON.stringify(studentsByCategory)
      );

      localStorage.setItem(
        'ncc_dates',
        JSON.stringify(dates)
      );

      localStorage.setItem(
        'ncc_attendance',
        JSON.stringify(attendance)
      );
    } catch (error) {
      console.error('Local save error:', error);
      setStatus('Local backup could not be saved.');
    }
  }

  function setStatus(message) {
    const element = document.getElementById('connection-status');
    if (element) element.textContent = message;
  }

  // ==========================================
  // 3. LOAD DATA FROM THREE TABLES
  // ==========================================

  async function loadDataFromCloud() {
    if (!db) {
      setStatus('Local Mode: Supabase is not connected.');
      render();
      return;
    }

    setStatus('Connecting to Supabase...');

    try {
      for (const category of CATEGORIES) {
        const table = TABLES[category];

        const { data, error } = await db
          .from(table)
          .select('id, cadet_name, attendance_date, attendance')
          .order('attendance_date', { ascending: true });

        if (error) throw error;

        // Rebuild this category using its own table.
        studentsByCategory[category] = [];
        dates[category] = [];
        attendance[category] = {};
        cloudCadetIds[category] = new Set();

        const uniqueNames = new Map();

        (data || []).forEach(row => {
          const name = row.cadet_name;

          if (!uniqueNames.has(name)) {
            uniqueNames.set(name, {
              id: `name-${category}-${name}`,
              name
            });
          }

          if (row.attendance_date) {
            if (!dates[category].includes(row.attendance_date)) {
              dates[category].push(row.attendance_date);
            }

            attendance[category][
              `${name}_${row.attendance_date}`
            ] = row.attendance;
          }

          cloudCadetIds[category].add(name);
        });

        studentsByCategory[category] =
          Array.from(uniqueNames.values());

        dates[category].sort();
      }

      saveLocal();
      setStatus('Connected to Supabase • All three registers loaded.');
    } catch (error) {
      console.error('Supabase load error:', error);
      setStatus(
        'Supabase error: ' + (error.message || 'Check database settings.')
      );
    }

    render();
  }

  // ==========================================
  // 4. SWITCH BETWEEN TABS
  // ==========================================

  function switchTab(tab) {
    if (!CATEGORIES.includes(tab)) return;

    currentTab = tab;

    CATEGORIES.forEach(category => {
      const button = document.getElementById(`tab-${category}`);

      button.className = category === tab
        ? 'pb-3 px-4 font-bold text-sm border-b-2 text-blue-600 border-blue-600 whitespace-nowrap'
        : 'pb-3 px-4 font-bold text-sm border-b-2 text-slate-500 border-transparent whitespace-nowrap';
    });

    render();
  }

  // ==========================================
  // 5. ADD CADET
  // ==========================================

  async function addStudent() {
    const name = prompt(
      `Enter ${LABELS[currentTab]} Cadet Name:`
    );

    if (!name || !name.trim()) return;

    const cleanName = name.trim();

    if (getCurrentStudents().some(
      student => student.name.toLowerCase() === cleanName.toLowerCase()
    )) {
      alert('This cadet already exists in this tab.');
      return;
    }

    if (db) {
      setStatus('Saving cadet to Supabase...');

      // A name is added to the current activity when its first
      // attendance entry is created. We therefore keep the new
      // name locally until a date and attendance are recorded.
    }

    studentsByCategory[currentTab].push({
      id: `local-${Date.now()}`,
      name: cleanName
    });

    saveLocal();
    render();

    if (db) {
      setStatus(
        'Cadet added locally. Mark attendance to create a database record.'
      );
    }
  }

  // ==========================================
  // 6. DELETE CADET
  // ==========================================

  async function deleteStudent(id) {
    if (!confirm('Delete this cadet from this activity?')) return;

    const student = getCurrentStudents().find(
      item => String(item.id) === String(id)
    );

    if (!student) return;

    const name = student.name;

    if (
      db &&
      cloudCadetIds[currentTab].has(name)
    ) {
      const { error } = await db
        .from(TABLES[currentTab])
        .delete()
        .eq('cadet_name', name);

      if (error) {
        console.error('Delete error:', error);
        alert('Could not delete from Supabase: ' + error.message);
        return;
      }
    }

    studentsByCategory[currentTab] =
      getCurrentStudents().filter(
        item => String(item.id) !== String(id)
      );

    Object.keys(attendance[currentTab]).forEach(key => {
      if (key.startsWith(`${name}_`)) {
        delete attendance[currentTab][key];
      }
    });

    cloudCadetIds[currentTab].delete(name);

    saveLocal();
    render();
  }

  // ==========================================
  // 7. ADD DATE
  // ==========================================

  async function addDate() {
    const date = prompt(
      `Enter ${LABELS[currentTab]} date (YYYY-MM-DD):`,
      new Date().toLocaleDateString('en-CA')
    );

    if (!date) return;

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) {
      alert('Enter the date in YYYY-MM-DD format.');
      return;
    }

    if (dates[currentTab].includes(date)) {
      alert('This date already exists in this tab.');
      return;
    }

    dates[currentTab].push(date);
    dates[currentTab].sort();

    saveLocal();
    render();

    // The tables store a date alongside each cadet's attendance.
    // A date with no attendance records is only stored locally.
    setStatus('Date added. Mark attendance to save records to Supabase.');
  }

  // ==========================================
  // 8. DELETE DATE
  // ==========================================

  async function deleteDate(date) {
    if (!confirm(`Delete ${date} from ${LABELS[currentTab]}?`)) return;

    if (db) {
      const { error } = await db
        .from(TABLES[currentTab])
        .delete()
        .eq('attendance_date', date);

      if (error) {
        console.error('Delete date error:', error);
        alert('Could not delete date records: ' + error.message);
        return;
      }
    }

    dates[currentTab] = dates[currentTab].filter(
      item => item !== date
    );

    Object.keys(attendance[currentTab]).forEach(key => {
      if (key.endsWith(`_${date}`)) {
        delete attendance[currentTab][key];
      }
    });

    saveLocal();
    render();
  }

  // ==========================================
  // 9. MARK ATTENDANCE
  // ==========================================

  async function toggleAttendance(studentId, date) {
    const student = getCurrentStudents().find(
      item => String(item.id) === String(studentId)
    );

    if (!student) return;

    const name = student.name;
    const key = `${name}_${date}`;
    const current = attendance[currentTab][key];

    // First click: Present
    // Second click: Absent
    // Third click: blank
    const next = !current ? 'P' : current === 'P' ? 'A' : '';

    const oldValue = current || '';

    if (next) {
      attendance[currentTab][key] = next;
    } else {
      delete attendance[currentTab][key];
    }

    saveLocal();
    render();

    if (!db) {
      setStatus('Saved in this browser only.');
      return;
    }

    const table = TABLES[currentTab];

    try {
      // Remove any old record for this cadet and date first.
      const { error: deleteError } = await db
        .from(table)
        .delete()
        .eq('cadet_name', name)
        .eq('attendance_date', date);

      if (deleteError) throw deleteError;

      if (next) {
        const status = next === 'P' ? 'Present' : 'Absent';

        const { error: insertError } = await db
          .from(table)
          .insert([{
            cadet_name: name,
            attendance_date: date,
            attendance: status
          }]);

        if (insertError) throw insertError;

        cloudCadetIds[currentTab].add(name);
      }

      setStatus('Attendance saved to ' + table + '.');
    } catch (error) {
      console.error('Attendance save error:', error);

      // Restore the previous value if Supabase rejected the change.
      if (oldValue) {
        attendance[currentTab][key] = oldValue;
      } else {
        delete attendance[currentTab][key];
      }

      saveLocal();
      render();

      setStatus('Save failed: ' + error.message);
      alert(
        'Supabase could not save attendance.\n\n' +
        error.message +
        '\n\nCheck your table columns and security policies.'
      );
    }
  }

  // ==========================================
  // 10. CALCULATE ATTENDANCE PERCENTAGE
  // ==========================================

  function calculatePercentage(category, studentId) {
    const student = studentsByCategory[category].find(
      item => String(item.id) === String(studentId)
    );

    if (!student) return 0;

    const name = student.name;
    let present = 0;
    let marked = 0;

    dates[category].forEach(date => {
      const value = attendance[category][`${name}_${date}`];

      if (value === 'P' || value === 'Present') {
        present++;
        marked++;
      } else if (value === 'A' || value === 'Absent') {
        marked++;
      }
    });

    return marked ? Math.round((present / marked) * 100) : 0;
  }

  // ==========================================
  // 11. SAFE HTML OUTPUT
  // ==========================================

  function escapeHTML(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    })[character]);
  }

  // ==========================================
  // 12. EXPORT CSV
  // ==========================================

  function exportToCSV() {
    const rows = [[
      'CATEGORY',
      'SR NO',
      'Cadet Name',
      'Date',
      'Attendance',
      'Percentage'
    ]];

    CATEGORIES.forEach(category => {
      studentsByCategory[category].forEach((student, index) => {
        dates[category].forEach(date => {
          const status =
            attendance[category][`${student.name}_${date}`] || '-';

          rows.push([
            category.toUpperCase(),
            index + 1,
            student.name,
            date,
            status,
            calculatePercentage(category, student.id) + '%'
          ]);
        });
      });
    });

    const csv = rows.map(row =>
      row.map(value =>
        `"${String(value).replace(/"/g, '""')}"`
      ).join(',')
    ).join('\r\n');

    const blob = new Blob(
      ['\uFEFF' + csv],
      { type: 'text/csv;charset=utf-8;' }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download =
      `NCC_Register_${new Date().toISOString().slice(0, 10)}.csv`;

    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  // ==========================================
  // 13. MONTH FILTER
  // ==========================================

  function getAvailableMonths() {
    return [
      ...new Set(
        dates[currentTab].map(date => date.slice(0, 7))
      )
    ].sort();
  }

  function formatMonthYear(value) {
    const [year, month] = value.split('-');

    const names = [
      'January', 'February', 'March', 'April',
      'May', 'June', 'July', 'August',
      'September', 'October', 'November', 'December'
    ];

    return `${names[Number(month) - 1]} ${year}`;
  }

  function updateFilterDropdown() {
    const dropdown = document.getElementById('date-filter');
    const previous = dropdown.value;

    dropdown.innerHTML =
      '<option value="all">Show All Dates</option>';

    getAvailableMonths().forEach(month => {
      const option = document.createElement('option');

      option.value = month;
      option.textContent = formatMonthYear(month);

      dropdown.appendChild(option);
    });

    dropdown.value = [...dropdown.options].some(
      option => option.value === previous
    ) ? previous : 'all';
  }

  // ==========================================
  // 14. RENDER TABLE
  // ==========================================

  function render() {
    const students = getCurrentStudents();

    updateFilterDropdown();

    const selected =
      document.getElementById('date-filter').value;

    const allDates = dates[currentTab];

    const visibleDates = selected === 'all'
      ? allDates
      : allDates.filter(date => date.startsWith(selected));

    document.getElementById('filter-status').textContent =
      selected === 'all'
        ? `Showing all ${visibleDates.length} dates.`
        : `Showing ${visibleDates.length} dates in ${formatMonthYear(selected)}.`;

    document.getElementById('btn-add-date').textContent =
      `+ Add ${LABELS[currentTab]} Date`;

    document.getElementById('table-header-row').innerHTML = `
      <th class="p-3 border-r w-12 text-center sticky-header-1">#</th>

      <th class="p-3 border-r min-w-[200px] sticky-header-2">
        Cadet Name
      </th>

      ${visibleDates.map(date => `
        <th class="p-3 border-r min-w-[130px] text-center">
          <div class="flex items-center justify-between gap-2">
            <span>${escapeHTML(date)}</span>
            <button
              onclick="deleteDate('${date}')"
              class="text-slate-400 hover:text-red-600 font-bold px-1"
              title="Delete date">×</button>
          </div>
        </th>
      `).join('')}

      <th class="p-3 border-l bg-slate-100 text-center w-28">
        ${LABELS[currentTab]} %
      </th>

      <th class="p-3 text-center w-24">Action</th>
    `;

    const body = document.getElementById('student-rows');

    if (!students.length) {
      body.innerHTML = `
        <tr>
          <td colspan="${visibleDates.length + 4}"
            class="text-center p-6 text-slate-400">
            No cadets in ${LABELS[currentTab]}.
            Click "+ Add Cadet Name" to add one.
          </td>
        </tr>
      `;
    } else {
      body.innerHTML = students.map((student, index) => {
        const cells = visibleDates.map(date => {
          const value =
            attendance[currentTab][`${student.name}_${date}`] || '';

          const status = value === 'Present' ? 'P'
            : value === 'Absent' ? 'A'
            : value;

          const style = status === 'P'
            ? 'bg-emerald-500 text-white font-bold hover:bg-emerald-600'
            : status === 'A'
              ? 'bg-rose-500 text-white font-bold hover:bg-rose-600'
              : 'bg-slate-50 text-slate-500 hover:bg-slate-100';

          return `
            <td class="p-2 border-r text-center">
              <button
                onclick="toggleAttendance('${String(student.id).replace(/'/g, "\\'")}','${date}')"
                class="w-full h-9 rounded text-xs ${style}">
                ${status || '-'}
              </button>
            </td>
          `;
        }).join('');

        const percentage = calculatePercentage(
          currentTab,
          student.id
        );

        return `
          <tr class="hover:bg-slate-50">
            <td class="p-3 border-r text-center sticky-col-1">
              ${index + 1}
            </td>

            <td class="p-3 border-r font-medium sticky-col-2">
              ${escapeHTML(student.name)}
            </td>

            ${cells}

            <td class="p-3 border-l text-center">
              <span class="bg-slate-100 font-bold px-2.5 py-1 rounded">
                ${percentage}%
              </span>
            </td>

            <td class="p-3 text-center">
              <button
                onclick="deleteStudent('${String(student.id).replace(/'/g, "\\'")}')"
                class="text-rose-600 hover:text-rose-800 font-semibold text-xs">
                Delete
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    document.getElementById('stat-cadets').textContent =
      students.length;

    document.getElementById('stat-parades').textContent =
      dates.parades.length;

    document.getElementById('stat-events').textContent =
      dates.events.length;

    document.getElementById('stat-officials').textContent =
      dates.officials.length;
  }

  // ==========================================
  // 15. START
  // ==========================================

  saveLocal();
  render();
  loadDataFromCloud();
</script>
